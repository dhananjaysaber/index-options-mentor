name: Build and Publish GitHub PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Test FYERS error handling
        run: npm test

      - name: Build PWA
        env:
          VITE_API_BASE: https://optionsmentor.netlify.app
          VITE_PUBLIC_BASE: /index-options-mentor-pwa/
        run: npm run build

      - name: Prepare public build
        run: touch dist/.nojekyll

      - name: Publish compiled PWA repository
        env:
          PWA_PUBLISH_TOKEN: ${{ secrets.PWA_PUBLISH_TOKEN }}
        run: |
          if [ -z "$PWA_PUBLISH_TOKEN" ]; then
            echo "PWA_PUBLISH_TOKEN is not configured."
            exit 1
          fi
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Index Options Mentor PWA from ${GITHUB_SHA}"
          git branch -M main
          git remote add origin "https://x-access-token:${PWA_PUBLISH_TOKEN}@github.com/dhananjaysaber/index-options-mentor-pwa.git"
          git push --force origin main
