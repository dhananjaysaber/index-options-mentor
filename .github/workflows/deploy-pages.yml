name: Build GitHub PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build PWA
        env:
          VITE_API_BASE: https://optionsmentor.netlify.app
        run: npm run build

      - name: Upload compiled PWA
        uses: actions/upload-artifact@v4
        with:
          name: index-options-mentor-pwa
          path: ./dist
          if-no-files-found: error
          retention-days: 7
