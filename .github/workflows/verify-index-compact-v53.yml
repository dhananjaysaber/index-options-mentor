name: Verify compact premium 13-Point chart UI
on:
  push:
    branches: [feature/index-compact-chart-ui-v53]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE: https://optionsmentor.netlify.app
          VITE_PUBLIC_BASE: /index-options-mentor-pwa/
          VITE_FYERS_TIER: prime
      - run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - run: node scripts/verify-iphone-shell.mjs

      - name: Package complete ready-to-paste files
        run: |
          mkdir -p option-b/src/components option-b/src option-b/public
          cp src/components/MobileMentorDashboardV41.jsx option-b/src/components/
          cp src/components/TraderMarketPanel.jsx option-b/src/components/
          cp src/components/CoreResearchPanel.jsx option-b/src/components/
          cp src/components/NiftyStrategyChart.jsx option-b/src/components/
          cp src/index-compact-v53.css src/main.jsx option-b/src/
          cp public/sw.js option-b/public/
          cp OPTION_B_README.md option-b/README.md
      - name: Publish copy-ready files for review
        uses: actions/upload-artifact@v4
        with:
          name: Index-Option-Mentor-Option-B-Complete-Files
          path: option-b/
          retention-days: 30
