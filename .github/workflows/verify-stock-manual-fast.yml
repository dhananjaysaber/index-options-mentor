name: Verify Stock watch-card layout and signed manual ticket
on:
  push:
    branches: [fix/stock-ticket-fast-ui-2026-11-19]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install project
        run: npm install
      - name: Run entire Index/Scalp/Stock suite
        run: npm test
      - name: Production PWA build
        run: npm run build
        env:
          VITE_API_BASE: https://optionsmentor.netlify.app
          VITE_PUBLIC_BASE: /index-options-mentor-pwa/
          VITE_FYERS_TIER: prime
