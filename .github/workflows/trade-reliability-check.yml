name: Verify SELL and profit trail (no deploy)

on:
  pull_request:
    branches: [main, feature/live-execution-20261123]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/verify-sell-no-black.mjs'
      - '.github/workflows/trade-reliability-check.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Existing and runner regression tests
        run: npm test
      - name: Build production PWA
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
      - name: Browser dependencies
        run: |
          npm install --no-save playwright fake-indexeddb --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Approved premium desktop and mobile design
        run: node scripts/verify-premium-design.mjs
        env:
          GITHUB_ACTIONS: 'true'
      - name: Isolated manual Scalp BUY, SELL and paper journal (no broker orders)
        run: node scripts/verify-manual-scalp-paper-entry.mjs
        env:
          GITHUB_ACTIONS: 'true'

      - name: SELL and navigation smoke on iPhone viewport
        run: node scripts/verify-sell-no-black.mjs
        env:
          GITHUB_ACTIONS: 'true'
      - name: Existing scalp trailing and guidance smoke
        run: node scripts/verify-scalp-guidance.mjs
        env:
          GITHUB_ACTIONS: 'true'

      - name: Durable storage failure and restart regressions
        run: node scripts/verify-trading-storage.mjs
      - name: Full phone storage manual and automatic exits
        run: node scripts/verify-quota-exits.mjs
        env:
          GITHUB_ACTIONS: 'true'
      - name: Desktop 13-point layout and mobile isolation
        run: node scripts/verify-core-desktop-layout.mjs
        env:
          GITHUB_ACTIONS: 'true'

      - name: Plain-English live settings and plan-only review
        run: node scripts/verify-live-settings-ux.mjs
        env:
          GITHUB_ACTIONS: 'true'


      - name: Save isolated UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-design-screenshots
          path: test-artifacts/premium-design/
          if-no-files-found: ignore
