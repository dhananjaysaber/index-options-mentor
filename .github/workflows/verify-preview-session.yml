name: Verify owned preview login handoff
on:
  pull_request:
    paths:
      - 'netlify/functions/fyers.mjs'
      - 'src/services/apiBridge.js'
      - 'tests/fyers-preview-session.test.mjs'
      - '.github/workflows/verify-preview-session.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/fyers-preview-session.test.mjs
