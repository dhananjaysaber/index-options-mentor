name: Verify Scalp option profit trail and visible guidance
on:
  push:
    branches: [fix/scalp-premium-trailing-guidance-2026-11-20]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run all index and Scalp regressions including premium-profit trailing
        run: npm test
      - name: Build Index-only FYERS Prime production PWA
        run: npm run build
        env:
          VITE_API_BASE: https://optionsmentor.netlify.app
          VITE_PUBLIC_BASE: /index-options-mentor-pwa/
          VITE_FYERS_TIER: prime
      - name: Install mobile browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Verify original iPhone header, navigation and trading dock
        run: node scripts/verify-iphone-shell.mjs
      - name: Verify profit-trail display and caution text visibility on mobile
        run: node scripts/verify-scalp-guidance.mjs
