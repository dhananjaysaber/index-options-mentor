name: Verify live execution with simulated broker
on:
  pull_request:
    paths:
      - 'aws/live/**'
      - 'aws/readiness/**'
      - 'apps-script/**'
      - 'tests/apps-script-setup-export.test.mjs'
      - 'tests/test_fyers_readiness.py'
      - 'tests/test_release_check.py'
      - 'scripts/build-release-check.py'
      - 'public/iom-release-check.py'
      - 'public/iom-live-readiness.py'
      - 'tests/test_live_readiness.py'
      - 'scripts/build-fyers-readiness.py'
      - 'public/iom-fyers-readiness.py'
      - 'aws/journal/store.py'
      - 'tests/live_*test.py'
      - 'tests/live-feed-publisher.test.mjs'
      - 'tests/order-host-auth.test.mjs'
      - 'tests/entry-signals.test.mjs'
      - 'tests/test_order_host_installer.py'
      - 'scripts/build-order-host.py'
      - 'scripts/order-host-template.py'
      - 'public/iom-order-host.py'
      - 'netlify/functions/orders.mjs'
      - 'server/mentorBase.js'
      - 'tests/test_live_connect_installer.py'
      - 'scripts/build-live-connect.py'
      - 'scripts/live-connect-template.py'
      - 'public/iom-live-connect.py'
      - 'tests/test_live_stage_installer.py'
      - 'public/iom-live-stage.py'
      - 'scripts/build-live-stage.py'
      - 'scripts/live-stage-template.py'
      - 'scripts/build-execution-connect.py'
      - 'scripts/execution-connect-template.py'
      - 'public/iom-execution-connect.py'
      - 'tests/execution-connection.test.mjs'
      - 'src/engine/managedPosition.js'
      - 'netlify/functions/execution.mjs'
      - '.github/workflows/verify-live-execution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulated-broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify installed-host read-only readiness checker
        run: python3 -m unittest discover -s tests -p 'test_live_readiness.py' -v
      - name: Entries, owned exits, HTTP authentication, restart, journal and backup
        run: python3 -m unittest discover -s tests -p 'live_*test.py' -v
      - name: Verify reproducible disabled installer and isolated installation
        run: |
          cp public/iom-live-stage.py /tmp/iom-live-stage.expected.py
          python3 scripts/build-live-stage.py
          cmp /tmp/iom-live-stage.expected.py public/iom-live-stage.py
          python3 -m unittest discover -s tests -p 'test_live_stage_installer.py' -v
      - name: Verify authenticated connection protocol and packaged diagnostic host
        run: |
          node --test tests/execution-connection.test.mjs
          cp public/iom-execution-connect.py /tmp/iom-execution-connect.expected.py
          python3 scripts/build-execution-connect.py
          cmp /tmp/iom-execution-connect.expected.py public/iom-execution-connect.py
          python3 public/iom-execution-connect.py --verify-only --journal-store aws/journal/store.py
      - name: Verify shared socket and separate trading login package
        run: |
          node --test tests/live-feed-publisher.test.mjs
          cp public/iom-live-connect.py /tmp/iom-live-connect.expected.py
          python3 scripts/build-live-connect.py
          cmp /tmp/iom-live-connect.expected.py public/iom-live-connect.py
          python3 -m unittest discover -s tests -p 'test_live_connect_installer.py' -v
          python3 public/iom-live-connect.py --verify-only --journal-store aws/journal/store.py
      - name: Verify actual order host with broker writes disabled
        run: |
          cp public/iom-order-host.py /tmp/iom-order-host.expected.py
          python3 scripts/build-order-host.py
          cmp /tmp/iom-order-host.expected.py public/iom-order-host.py
          python3 -m unittest discover -s tests -p 'test_order_host_installer.py' -v
          python3 public/iom-order-host.py --verify-only --journal-store aws/journal/store.py
      - name: Verify read-only FYERS checker and published checksum source
        run: |
          cp public/iom-fyers-readiness.py /tmp/iom-fyers-readiness.expected.py
          python3 scripts/build-fyers-readiness.py
          cmp /tmp/iom-fyers-readiness.expected.py public/iom-fyers-readiness.py
          python3 -m unittest discover -s tests -p 'test_fyers_readiness.py' -v
      - name: Verify consolidated journal backup, export and replay check
        run: |
          cp public/iom-release-check.py /tmp/iom-release-check.expected.py
          python3 scripts/build-release-check.py
          cmp /tmp/iom-release-check.expected.py public/iom-release-check.py
          python3 -m unittest discover -s tests -p 'test_release_check.py' -v
      - name: Verify setup-decision export authentication and replay without production Sheets
        run: node --test tests/apps-script-setup-export.test.mjs

