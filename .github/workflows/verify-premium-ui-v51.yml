name: Verify approved premium trading UI
on:
  push:
    branches: [feature/premium-fintech-ui-2026-11-19]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Verify all Index, Scalp and premium UI regressions
        run: npm test
      - name: Build production PWA with FYERS Prime settings
        run: npm run build
        env:
          VITE_API_BASE: https://optionsmentor.netlify.app
          VITE_PUBLIC_BASE: /index-options-mentor-pwa/
          VITE_FYERS_TIER: prime
