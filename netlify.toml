"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html vite.config.js netlify/functions server netlify.toml package.json package-lock.json"

[build.environment]
  VITE_FYERS_TIER = "prime"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/fyers/*"
  to = "/.netlify/functions/fyers/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/monitor/*"
  to = "/.netlify/functions/monitor/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/execution/*"
  to = "/.netlify/functions/execution/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/orders/*"
  to = "/.netlify/functions/orders/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

