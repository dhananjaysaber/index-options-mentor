[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_FYERS_TIER = "prime"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/fyers/*"
  to = "/.netlify/functions/fyers/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/monitor/*"
  to = "/.netlify/functions/monitor/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
