[build]
  command = "npm run build"
  publish = "dist"
  ignore = "exit 1"

[context.production.environment]
  VITE_STOCK_SCANNER_ENABLED = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/fyers/*"
  to = "/.netlify/functions/fyers/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
